<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: data: blob:;
             img-src 'self' https: http: data: blob:;
             connect-src 'self' https: http:;">
  <title>TraceVis</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="topbar">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 40 40" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 30 Q 20 14 30 10" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="10" cy="30" r="3.5" fill="#22d3a0"/>
        <circle cx="20" cy="20" r="2.2" fill="currentColor" opacity="0.75"/>
        <circle cx="30" cy="10" r="3.5" fill="#f87171"/>
      </svg>
    </div>
    <div class="logo-wordmark">TRACE<em>VIS</em></div>
  </div>

  <div class="vdiv"></div>

  <!-- Search input -->
  <div class="input-group">
    <span class="input-prefix">⌖</span>
    <input id="target-input" type="text" placeholder="youtube.com  or  2001:4860:4860::8888"
      autocomplete="off" spellcheck="false">
  </div>

  <!-- Trace button -->
  <button id="trace-btn" data-i18n="trace">Trace</button>

  <!-- Options row -->
  <div class="options-row">
    <!-- Resolve DNS toggle -->
    <label class="opt-toggle" title="Resolve hostnames via DNS">
      <input type="checkbox" id="resolve-dns-cb">
      <span class="opt-toggle-track">
        <span class="opt-toggle-thumb"></span>
      </span>
      <span class="opt-label" data-i18n="resolve_dns">Resolve DNS</span>
    </label>
  </div>

  <!-- Status -->
  <div class="status-pill" id="status-pill">
    <div class="status-dot"></div>
    <span class="status-text" data-i18n="ready">Ready</span>
  </div>

  <!-- Right controls -->
  <div class="topbar-right">
    <!-- Language toggle -->
    <button id="lang-toggle" class="icon-btn" title="Toggle language / Alternar idioma">EN</button>
    <!-- Theme toggle -->
    <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
  </div>

  <!-- Window controls -->
  <div class="win-controls">
    <button class="win-btn min" id="btn-min"></button>
    <button class="win-btn max" id="btn-max"></button>
    <button class="win-btn close" id="btn-close"></button>
  </div>

</header>

<div id="app">

  <!-- MAP -->
  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-hint" id="map-hint">
      <div class="hint-ring">🌐</div>
      <div class="hint-text" data-i18n="hint_text">
        Enter a domain or IP (v4/v6) above<br>and press <strong>Trace</strong> to visualise the route
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside id="sidebar">

    <div class="sb-header">
      <div class="sb-eyebrow" data-i18n="route_analysis">Route Analysis</div>
      <div class="stats-strip">
        <div class="stat-cell">
          <div class="stat-val" id="stat-hops">0</div>
          <div class="stat-key" data-i18n="hops">Hops</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-countries">0</div>
          <div class="stat-key" data-i18n="countries">Countries</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-rtt">—</div>
          <div class="stat-key" data-i18n="max_rtt">Max RTT</div>
        </div>
      </div>
    </div>

    <div id="hop-list">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🌐</div>
        <div class="empty-label" data-i18n="empty_label">
          Enter a domain or IP address<br>and press Trace to begin
        </div>
      </div>
    </div>

    <div id="hop-detail"></div>

  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
