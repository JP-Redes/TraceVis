<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: data: blob:;
             img-src 'self' https: http: data: blob:;
             connect-src 'self' https: http:;">
  <title>TraceVis</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Progress bar (thin line below topbar, shown during trace) -->
<div id="progress-bar" class="progress-bar hidden"></div>

<header id="topbar">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 40 40" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 30 Q 20 14 30 10" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="10" cy="30" r="3.5" fill="#22d3a0"/>
        <circle cx="20" cy="20" r="2.2" fill="currentColor" opacity="0.75"/>
        <circle cx="30" cy="10" r="3.5" fill="#f87171"/>
      </svg>
    </div>
    <div class="logo-wordmark">TRACE<em>VIS</em></div>
  </div>

  <div class="vdiv"></div>

  <!-- Input group with history -->
  <div class="input-group" id="input-group-wrap">
    <span class="input-prefix">⌖</span>
    <input id="target-input" type="text" placeholder="youtube.com  or  2001:4860:4860::8888"
      autocomplete="off" spellcheck="false">
    <button id="history-btn" class="input-history-btn" title="Recent traces / Rastreamentos recentes">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </button>
    <!-- History dropdown -->
    <div id="history-dropdown" class="history-dropdown hidden"></div>
  </div>

  <!-- Trace button -->
  <button id="trace-btn" data-i18n="trace">Trace</button>

  <!-- Clear button (shown when there are hops) -->
  <button id="clear-btn" class="icon-btn clear-btn hidden" title="Clear / Limpar">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <!-- Options row -->
  <div class="options-row">
    <label class="opt-toggle" title="Resolve hostnames via DNS">
      <input type="checkbox" id="resolve-dns-cb">
      <span class="opt-toggle-track">
        <span class="opt-toggle-thumb"></span>
      </span>
      <span class="opt-label" data-i18n="resolve_dns">Resolve DNS</span>
    </label>
  </div>

  <!-- Status -->
  <div class="status-pill" id="status-pill">
    <div class="status-dot"></div>
    <span class="status-text" data-i18n="ready">Ready</span>
  </div>

  <!-- Right controls -->
  <div class="topbar-right">
    <button id="shortcuts-btn" class="icon-btn" title="Keyboard shortcuts / Atalhos">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="13" rx="2"/>
        <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
      </svg>
    </button>
    <button id="lang-toggle" class="icon-btn" title="Toggle language / Alternar idioma">EN</button>
    <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
  </div>

  <!-- Window controls -->
  <div class="win-controls">
    <button class="win-btn min" id="btn-min"></button>
    <button class="win-btn max" id="btn-max"></button>
    <button class="win-btn close" id="btn-close"></button>
  </div>

</header>

<!-- Shortcuts modal -->
<div id="shortcuts-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-title" data-i18n="shortcuts_title">Keyboard Shortcuts</div>
    <div class="shortcut-list" id="shortcut-list"></div>
    <button class="modal-close" id="shortcuts-close">✕</button>
  </div>
</div>

<div id="app">

  <!-- MAP -->
  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-hint" id="map-hint">
      <div class="hint-ring">🌐</div>
      <div class="hint-text" data-i18n="hint_text">
        Enter a domain or IP (v4/v6) above<br>and press <strong>Trace</strong> to visualise the route
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside id="sidebar">

    <div class="sb-header">
      <div class="sb-eyebrow">
        <span data-i18n="route_analysis">Route Analysis</span>
        <!-- Export toolbar toggle -->
        <button id="export-btn" class="sb-action-btn hidden" data-i18n-title="export_toolbar" title="Export">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <!-- Filter toggle -->
        <button id="filter-btn" class="sb-action-btn hidden" title="Filter hops / Filtrar saltos">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
        </button>
      </div>

      <!-- Main stats -->
      <div class="stats-strip">
        <div class="stat-cell">
          <div class="stat-val" id="stat-hops">0</div>
          <div class="stat-key" data-i18n="hops">Hops</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-countries">0</div>
          <div class="stat-key" data-i18n="countries">Countries</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-rtt">—</div>
          <div class="stat-key" data-i18n="max_rtt">Max RTT</div>
        </div>
      </div>

      <!-- Secondary stats -->
      <div class="secondary-stats" id="secondary-stats">
        <div class="sec-stat">
          <span class="sec-key" data-i18n="avg_rtt">Avg RTT</span>
          <span class="sec-val" id="stat-avg-rtt">—</span>
        </div>
        <div class="sec-stat">
          <span class="sec-key" data-i18n="loss">Loss</span>
          <span class="sec-val" id="stat-loss">—</span>
        </div>
      </div>

      <!-- RTT chart -->
      <div class="rtt-chart-wrap hidden" id="rtt-chart-wrap">
        <div class="rtt-chart-label" data-i18n="rtt_profile">RTT Profile</div>
        <svg id="rtt-chart" class="rtt-chart" preserveAspectRatio="none"></svg>
      </div>

      <!-- Filter row -->
      <div class="hop-filter-row hidden" id="hop-filter-row">
        <input id="hop-filter" type="text" data-i18n-placeholder="filter_placeholder" placeholder="Filter hops…" autocomplete="off" spellcheck="false">
        <button id="hop-filter-clear" class="filter-clear-btn" title="Clear filter">✕</button>
      </div>
    </div>

    <!-- Hop list -->
    <div id="hop-list">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🌐</div>
        <div class="empty-label" data-i18n="empty_label">
          Enter a domain or IP address<br>and press Trace to begin
        </div>
      </div>
    </div>

    <!-- Hop detail -->
    <div id="hop-detail"></div>

    <!-- Export toolbar -->
    <div id="export-toolbar" class="export-toolbar hidden">
      <button id="btn-copy-report" class="export-action-btn" data-i18n="copy_report">Copy Report</button>
      <button id="btn-export-json" class="export-action-btn" data-i18n="export_json">JSON</button>
      <button id="btn-export-csv"  class="export-action-btn" data-i18n="export_csv">CSV</button>
    </div>

  </aside>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
