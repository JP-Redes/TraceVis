<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b33"/>
      <stop offset="100%" style="stop-color:#070d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00eaff"/>
      <stop offset="100%" style="stop-color:#0088cc"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="85" x2="256" y2="85"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="171" x2="256" y2="171"/>
    <line x1="85" y1="0" x2="85" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="171" y1="0" x2="171" y2="256"/>
  </g>

  <!-- Route arc: origin (bottom-left) → hop → destination (top-right) -->
  <path d="M 68 188 Q 128 80 188 68" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Origin node (green) -->
  <circle cx="68" cy="188" r="10" fill="#22d3a0" opacity="0.95"/>
  <circle cx="68" cy="188" r="18" fill="none" stroke="#22d3a0" stroke-width="2" opacity="0.35"/>
  <circle cx="68" cy="188" r="26" fill="none" stroke="#22d3a0" stroke-width="1" opacity="0.15"/>

  <!-- Mid hop node (accent) -->
  <circle cx="128" cy="128" r="7" fill="#00d4ff" opacity="0.85"/>
  <circle cx="128" cy="128" r="14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>

  <!-- Destination node (red) -->
  <circle cx="188" cy="68" r="10" fill="#f87171" opacity="0.95"/>
  <circle cx="188" cy="68" r="18" fill="none" stroke="#f87171" stroke-width="2" opacity="0.35"/>
  <circle cx="188" cy="68" r="26" fill="none" stroke="#f87171" stroke-width="1" opacity="0.15"/>

  <!-- White border highlight -->
  <rect width="256" height="256" rx="48" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
</svg>
